name: Release

# 打 tag 即发版：自动打包并把离线安装包作为 Release 资产上传。
# Pushing a tag publishes the release and attaches the offline install tarball.
#
#   git tag v2.5.7 && git push origin v2.5.7
#
# The tarball is built from the checked-out tag, so its content always matches
# the tag — and scripts/release.sh --check --strict aborts the release on any
# mandatory failure (version mismatch, missing bilingual changelog, code syntax
# error, or files/ disagreeing with checksums.sha256), so a stale/incorrect
# release fails loudly before the asset is ever built.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：release.sh 会用 git describe --exact-match --tags 交叉核对
          # tag 与 manifest 版本，浅克隆下可能取不到 tag。
          # Full history so the tag/version cross-check inside release.sh works.
          fetch-depth: 0

      - name: Install Lua (required by the Lua syntax gate)
        run: |
          # runner 镜像不含 lua/luajit；Lua 语法是本项目历史 P0 高发区，
          # 缺校验器就等于门禁静默失效（release.sh --strict 会因此直接失败）。
          # The runner image ships no lua/luajit. release.sh --strict now fails when
          # the checker is missing, so install it explicitly.
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          # 提供版本无关的名字（release.sh 也探测 lua5.4/luac5.4 作为兜底）。
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua 2>/dev/null || true
          if command -v luac5.4 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v luac5.4)" /usr/local/bin/luac
          fi
          echo "lua:  $(command -v lua  || echo '<missing>')"
          echo "luac: $(command -v luac || echo '<missing>')"

      - name: Preflight release check (version / changelog / syntax / fingerprint)
        run: |
          # 推送前完整检查：版本一致性、双语变更记录、代码语法、内容指纹、
          # changes_package 同步。任意强制项失败即让发版中止。
          # Full pre-push check: version consistency, bilingual changelog, code
          # syntax, content fingerprint, changes_package sync. Any mandatory
          # failure aborts the release loudly.
          sh scripts/release.sh --check --strict

      - name: Build the offline install package
        run: sh scripts/make_package.sh

      - name: Create release and upload the package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 撤回重发（删 tag 后重推同名 tag）时旧 Release 仍在，先删除再重建，
          # 否则 gh release create 会以 "release already exists" 失败。
          # A re-pushed tag (withdraw & re-release) leaves the previous release in
          # place; remove it first so the recreation is idempotent. Without
          # --cleanup-tag only the release is removed, never the git tag.
          gh release delete "$TAG" --yes 2>/dev/null || echo "no existing release for $TAG (first publish)"
          # Release body is bilingual: English first (default), Chinese after.
          NOTES=$(cat <<'EOF'
          Offline install: download the tarball below, extract it, then run
          `scripts/install.sh` — see INSTALL.md inside the package for details.
          The AdGuard Home core is never bundled; drop the official
          `AdGuardHome_linux_<arch>.tar.gz` next to the extracted folder and the
          installer picks it up automatically.

          ---

          离线安装：下载下方压缩包并解压，运行 `scripts/install.sh` 即可（详见包内
          INSTALL.md）。本包不包含 AdGuard Home 核心——把官方
          `AdGuardHome_linux_<arch>.tar.gz` 放在解压目录（或其上一级），
          安装脚本会自动识别并安装。
          EOF
          )
          # 未匹配到时会把字面量 dist/*.tar.gz 传给 gh 并报错，正好起到断言作用。
          # A non-matching glob is passed literally to gh, which then fails — a built-in assertion.
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" --generate-notes dist/*.tar.gz
